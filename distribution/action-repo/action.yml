# Generated from action.yml in github.com/pranavsaji/exorcist-98 by scripts/action-repo.mjs. Do not edit here.
name: Exorcist 98
description: "Scan a repository for attacks on AI coding agents: hidden instructions, poisoned MCP tools, dangerous hooks, leaked secrets."
author: Pranav Saji
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Folder or file to scan, relative to the workspace.
    default: "."
  fail-on:
    description: Fail the job if a finding is at least this severe (critical, high, medium, low or none).
    default: high
  ignore:
    description: Paths to skip, one per line (prefixes relative to the scanned folder).
    default: ""
  comment:
    description: Post (or update) a summary comment on pull requests.
    default: "true"
  upload-sarif:
    description: Upload results to GitHub code scanning. Needs the security-events write permission.
    default: "false"
  lock-check:
    description: >-
      Check the MCP config against the committed exorcist.lock and fail the job on any difference.
      "true" runs "exorcist lock --check --static": it starts nothing and compares the server names,
      each server's program (command, arguments, argument files, env and cwd) and remote URLs.
      "live" also starts every server to compare tool descriptions; that runs the commands in the
      config, which a pull request (or any branch) can change to run anything with this job's secrets
      and token. So "live" runs only on push, schedule and workflow_dispatch events, only on the
      repository's default branch, and only when the commit checked out is GITHUB_SHA; the action
      refuses it everywhere else (pull_request, pull_request_target, workflow_run, issue_comment,
      merge_group and every other event). With "comment", the report is posted on the pull request.
      "false" (default) skips it.
    default: "false"
  lock-config:
    description: MCP config for lock-check, relative to the workspace (default .kiro/settings/mcp.json).
    default: ""

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.report.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "22"

    # The published CLI at one pinned version, checked against its npm provenance
    # (npm audit signatures). Nothing is built and no install scripts run.
    - name: Install Exorcist 98 (@exorcist-98/cli@0.1.3)
      shell: bash
      run: |
        dir="$RUNNER_TEMP/exorcist-cli"
        mkdir -p "$dir" && cd "$dir"
        npm init -y >/dev/null
        npm install --no-fund --no-audit --ignore-scripts "@exorcist-98/cli@0.1.3"
        npm audit signatures

    - name: Scan
      id: report
      shell: bash
      env:
        EXORCIST_CLI: ${{ runner.temp }}/exorcist-cli/node_modules/@exorcist-98/cli/dist/index.mjs
        SCAN_PATH: ${{ inputs.path }}
        SCAN_IGNORE: ${{ inputs.ignore }}
      run: |
        args=()
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--ignore "$line")
        done <<< "$SCAN_IGNORE"
        out="$RUNNER_TEMP/exorcist"
        mkdir -p "$out"
        node "$EXORCIST_CLI" scan "$SCAN_PATH" "${args[@]}" --format sarif    --output "$out/exorcist.sarif" --fail-on none
        node "$EXORCIST_CLI" scan "$SCAN_PATH" "${args[@]}" --format markdown --output "$out/exorcist.md"    --fail-on none
        echo "sarif=$out/exorcist.sarif" >> "$GITHUB_OUTPUT"
        echo "markdown=$out/exorcist.md" >> "$GITHUB_OUTPUT"
        cat "$out/exorcist.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.report.outputs.sarif }}
        category: exorcist-98

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v9
      env:
        REPORT_FILE: ${{ steps.report.outputs.markdown }}
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- exorcist-98 -->';
          const body = `${marker}\n${fs.readFileSync(process.env.REPORT_FILE, 'utf8')}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find((c) => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    # m5: exorcist.lock. Only when lock-check is "true" (static) or "live"; with "false" none of these steps run.
    - name: Check exorcist.lock
      id: lock
      if: ${{ inputs.lock-check != 'false' && inputs.lock-check != '' }}
      shell: bash
      env:
        EXORCIST_CLI: ${{ runner.temp }}/exorcist-cli/node_modules/@exorcist-98/cli/dist/index.mjs
        LOCK_CONFIG: ${{ inputs.lock-config }}
        LOCK_MODE: ${{ inputs.lock-check }}
        EVENT_NAME: ${{ github.event_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        out="$RUNNER_TEMP/exorcist"
        mkdir -p "$out"
        args=()
        case "$LOCK_MODE" in
          true|static)
            args+=(--static) ;;
          live)
            # A live check starts the servers named in the config, so it runs
            # only where the config is the repository's own: an allowlist of
            # events, on the default branch, at the commit that was pushed.
            refuse() {
              echo "::error title=Exorcist 98::lock-check: live starts every MCP server in the config, so it only runs on push, schedule or workflow_dispatch, on the default branch, with GITHUB_SHA checked out. Refusing: $1. Use lock-check: true (static, starts nothing) here."
              exit 2
            }
            case "$EVENT_NAME" in
              push|schedule|workflow_dispatch) ;;
              *) refuse "the event is '$EVENT_NAME'" ;;
            esac
            [ -n "$DEFAULT_BRANCH" ] || refuse "the repository's default branch is not known for this event"
            [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || refuse "'$GITHUB_REF' is not the default branch ($DEFAULT_BRANCH)"
            checked_out="$(git rev-parse HEAD 2>/dev/null || true)"
            [ -n "$GITHUB_SHA" ] && [ "$checked_out" = "$GITHUB_SHA" ] || refuse "the commit checked out (${checked_out:-none}) is not GITHUB_SHA (${GITHUB_SHA:-unset})"
            ;;
          *)
            echo "::error title=Exorcist 98::lock-check must be false, true or live (got '$LOCK_MODE')."
            exit 2 ;;
        esac
        [ -n "$LOCK_CONFIG" ] && args+=(--config "$LOCK_CONFIG")
        set +e
        node "$EXORCIST_CLI" lock --check "${args[@]}" > "$out/lock.txt" 2>&1
        code=$?
        set -e
        cat "$out/lock.txt"
        # The report quotes tool descriptions (untrusted text), so it goes in a
        # code fence longer than any run of backticks inside it.
        LOCK_CODE="$code" node -e '
          const fs = require("fs");
          const [txt, md] = process.argv.slice(1);
          const text = fs.readFileSync(txt, "utf8").trimEnd();
          const fence = "`".repeat(Math.max(3, ...(text.match(/`+/g) || []).map((m) => m.length + 1)));
          const code = process.env.LOCK_CODE;
          const head = code === "0" ? "exorcist.lock is up to date: every MCP tool matches its locked fingerprint."
            : code === "1" ? "**exorcist.lock does not match the MCP servers.** A tool or program changed since it was approved. If every change is expected, run `exorcist lock` and commit exorcist.lock."
            : "**exorcist.lock could not be checked.**";
          fs.writeFileSync(md, `### Exorcist 98: exorcist.lock\n\n${head}\n\n${fence}text\n${text}\n${fence}\n`);
        ' "$out/lock.txt" "$out/lock.md"
        cat "$out/lock.md" >> "$GITHUB_STEP_SUMMARY"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "markdown=$out/lock.md" >> "$GITHUB_OUTPUT"

    - name: Comment the exorcist.lock differences on the pull request
      if: ${{ inputs.lock-check != 'false' && inputs.lock-check != '' && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v9
      env:
        REPORT_FILE: ${{ steps.lock.outputs.markdown }}
        LOCK_CODE: ${{ steps.lock.outputs.code }}
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- exorcist-98-lock -->';
          const body = `${marker}\n${fs.readFileSync(process.env.REPORT_FILE, 'utf8')}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find((c) => c.body && c.body.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else if (process.env.LOCK_CODE !== '0') {
            // Only a difference starts a new comment; an earlier one is updated once it is fixed.
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail on exorcist.lock differences
      if: ${{ inputs.lock-check != 'false' && inputs.lock-check != '' }}
      shell: bash
      env:
        LOCK_CODE: ${{ steps.lock.outputs.code }}
      run: |
        if [ "$LOCK_CODE" != "0" ]; then
          echo "exorcist lock --check exited $LOCK_CODE (1: the lock does not match the MCP servers, 2: it could not be checked)."
          exit 1
        fi

    - name: Fail on findings
      shell: bash
      env:
        EXORCIST_CLI: ${{ runner.temp }}/exorcist-cli/node_modules/@exorcist-98/cli/dist/index.mjs
        SCAN_PATH: ${{ inputs.path }}
        SCAN_IGNORE: ${{ inputs.ignore }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=()
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--ignore "$line")
        done <<< "$SCAN_IGNORE"
        node "$EXORCIST_CLI" scan "$SCAN_PATH" "${args[@]}" --fail-on "$FAIL_ON"
