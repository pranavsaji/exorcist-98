id: EX-003
title: Encoded payload
severity: high
applies_to:
  - instruction
  - docs
  - config
  - code
  - hook
  - mcp-config
match:
  # A run of 40 or more base64 characters. Two ordinary kinds of long base64
  # are skipped: package integrity hashes ("sha512-...") that fill lockfiles,
  # and inline data URIs ("data:image/png;base64,...").
  regex: "(?<!sha(?:1|256|384|512)-)(?<!base64,)(?<![A-Za-z0-9+/=])[A-Za-z0-9+/=]{40,}(?![A-Za-z0-9+/=])"
  # Only runs that decode to readable text count. URL paths, hashes, git SHAs
  # and identifiers decode to binary noise; before this check they were about
  # 99% of all findings on ordinary repositories (docs/BENCHMARK.md).
  validate: base64-text
skip_paths:
  - "(^|/)(tests?|__tests__|__mocks__|spec|specs|fixtures?|testdata|test-data|e2e)/|[._-](test|spec)s?\\.[A-Za-z0-9]+$|_tests?\\.(rs|go|py)$"
  - "(^|/)(package-lock\\.json|npm-shrinkwrap\\.json|pnpm-lock\\.yaml|yarn\\.lock|bun\\.lockb?|Cargo\\.lock|poetry\\.lock|Pipfile\\.lock|uv\\.lock|go\\.sum|composer\\.lock|Gemfile\\.lock|[^/]*\\.lock\\.ya?ml)$"
owasp:
  - "LLM01:2025 Prompt Injection"
  - "ASI03 Prompt Injection via External Content"
fix: >
  Investigate the base64 blob. If it decodes to a URL or instruction string,
  remove it. If it is a legitimate asset (e.g. an icon), move it to a binary
  file and reference it by path instead of embedding it inline.
