id: EX-007
title: Over-broad auto-approve
severity: high
applies_to:
  - mcp-config
  - config
match:
  json_path: "$..autoApprove[*]"
owasp:
  - "ASI02 Inadequate Human-in-the-Loop Controls"
  - "MCP05 Excessive Tool Permissions"
fix: >
  Remove write, delete, shell and execution tools from autoApprove. Auto-approve
  should only be used for read-only, low-risk tools. For tools that need
  frequent access, consider a confirmation-based approval rather than
  auto-approve.
