id: EX-001
title: Hidden Unicode instructions
severity: critical
applies_to:
  - instruction
  - docs
  - config
match:
  regex: "(\\\\u200[BCD]|\\\\uFEFF|\\\\u202[A-E]|\\\\u206[6-9]|\\\\u{E0[0-9A-F]{3}}|ZERO WIDTH|BIDI OVERRIDE|TAG LATIN|tag-block|bidi-override|zero-width)"
owasp:
  - "LLM01:2025 Prompt Injection"
  - "ASI03 Prompt Injection via External Content"
fix: >
  Remove or escape the hidden characters. Use a Unicode-aware editor or run
  `cat -A` to reveal them. Consider adding a linter rule that bans these
  code points in text files.
