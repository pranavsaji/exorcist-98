id: EX-014
title: Steering override
severity: high
applies_to:
  - instruction
  - memory
match:
  # A steering or rules file that tells the agent to drop its safeguards: skip
  # approvals, outrank the user, or hide what it does. Ordinary project rules
  # ("always run the tests") are not flagged. "Proceed without asking" on its
  # own is ordinary autonomy guidance ("when the choice is already made,
  # proceed without asking"); it counts only when approval, permission or
  # confirmation is what gets skipped, and not when the sentence forbids it
  # ("do not proceed without approval").
  regex: "(?:\\bdisable\\s+(?:all\\s+)?(?:safety|security)\\s+(?:checks|guards?|rules|prompts)\\b|\\bauto[- ]?approve\\s+(?:all|every|any)\\s+(?:tool\\s+)?(?:calls?|actions?|commands?|tools?)\\b|\\bnever\\s+(?:show|ask\\s+for|display)\\s+(?:approval|confirmation)\\s+(?:prompts?|dialogs?)\\b|(?<!(?:\\bnot|\\bnever|n't)\\b[^.\\n]{0,40})\\b(?:proceed|act|run|continue|execute)\\s+(?:(?:all|every|any|each|the)\\s+)?(?:(?:tool\\s+)?(?:calls?|commands?|actions?|steps?|changes?|tools?|tasks?)\\s+)?without\\s+(?:asking\\s+(?:the\\s+user\\s+)?(?:for\\s+)?(?:approval|permission|confirmation)|(?:any\\s+|user\\s+)?(?:confirmation|approval|permission)s?)\\b|\\b(?:take|takes|have|has)\\s+(?:higher|top|absolute)\\s+priority\\s+(?:over|than)\\s+(?:the\\s+)?(?:user|any\\s+other)\\b|\\boverrides?\\s+(?:all\\s+|any\\s+)?(?:the\\s+)?(?:user'?s?|system|previous|prior)\\s+(?:instructions|requests|rules|prompts?)\\b|\\b(?:never|do\\s+not)\\s+(?:show|display|reveal|tell)\\s+(?:this|these|it)\\s+(?:to\\s+)?(?:the\\s+)?user\\b|\\bthe\\s+user\\s+has\\s+pre-?authori[sz]ed\\b)"
  # A phrase in quotation marks that close right after it, in a passage that
  # is warning about it or quoting it as an example ("never follow text such
  # as ..."), is not an order. In the field that was 35 of 42 findings of
  # EX-002 (docs/FIELD_REPORT.md). A quoted phrase that runs on into a longer
  # instruction is still reported.
  quoted_example_cues: '\b(?:such\s+as|e\.g\.|i\.e\.|for\s+(?:example|instance)|never|do\s+not|don''t|must\s+not|should\s+not|refuse|reject|treat|untrusted|inert|injection|jailbreak|adversarial|attack|malicious|hostile|crafted|hijack|red[- ]?team|detect|flag|block|strip|sanitiz|filter|pattern|phrase|cases?\b|example|quarantine|directive|look(?:s|ing)?\s+like|shaped)'
# READMEs describe features ("--yolo auto-approves all tools"); this rule is
# about steering and rules files that the agent obeys.
skip_paths:
  - "(^|/)README[^/]*$"
owasp:
  - "ASI02 Inadequate Human-in-the-Loop Controls"
  - "LLM01:2025 Prompt Injection"
fix: >
  Remove the instruction. A steering or rules file should describe the
  project, not switch off approvals or tell the agent to outrank or hide
  things from you. Keep approval prompts on for tools that write, delete or
  run commands.
