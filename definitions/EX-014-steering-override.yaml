id: EX-014
title: Steering override
severity: high
applies_to:
  - instruction
  - memory
match:
  # A steering or rules file that tells the agent to drop its safeguards: skip
  # approvals, outrank the user, or hide what it does. Ordinary project rules
  # ("always run the tests") are not flagged.
  regex: "(?:\\bdisable\\s+(?:all\\s+)?(?:safety|security)\\s+(?:checks|guards?|rules|prompts)\\b|\\bauto[- ]?approve\\s+(?:all|every|any)\\s+(?:tool\\s+)?(?:calls?|actions?|commands?|tools?)\\b|\\bnever\\s+(?:show|ask\\s+for|display)\\s+(?:approval|confirmation)\\s+(?:prompts?|dialogs?)\\b|\\b(?:proceed|act|run|continue)\\s+without\\s+(?:asking|confirmation|approval)\\b|\\b(?:take|takes|have|has)\\s+(?:higher|top|absolute)\\s+priority\\s+(?:over|than)\\s+(?:the\\s+)?(?:user|any\\s+other)\\b|\\boverrides?\\s+(?:all\\s+|any\\s+)?(?:other\\s+|previous\\s+|user\\s+)?(?:instructions|requests|rules)\\b|\\b(?:never|do\\s+not)\\s+(?:show|display|reveal|tell)\\s+(?:this|these|it)\\s+(?:to\\s+)?(?:the\\s+)?user\\b|\\bthe\\s+user\\s+has\\s+pre-?authori[sz]ed\\b)"
# READMEs describe features ("--yolo auto-approves all tools"); this rule is
# about steering and rules files that the agent obeys.
skip_paths:
  - "(^|/)README[^/]*$"
owasp:
  - "ASI02 Inadequate Human-in-the-Loop Controls"
  - "LLM01:2025 Prompt Injection"
fix: >
  Remove the instruction. A steering or rules file should describe the
  project, not switch off approvals or tell the agent to outrank or hide
  things from you. Keep approval prompts on for tools that write, delete or
  run commands.
