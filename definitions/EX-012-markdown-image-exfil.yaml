id: EX-012
title: Markdown image exfiltration
severity: high
applies_to:
  - instruction
  - docs
match:
  regex: "!\\[[^\\]]*\\]\\(https?://[^)]+\\?[^)]+\\)"
  # Well-known badge services take query strings by design.
  exclude_regex: "\\]\\(https?://(?:(?:img\\.shields\\.io|shields\\.io|badgen\\.net|badge\\.fury\\.io|(?:app\\.)?codecov\\.io|coveralls\\.io|(?:api\\.)?travis-ci\\.(?:org|com)|(?:dl\\.)?circleci\\.com|api\\.netlify\\.com|deepwiki\\.com/badge|www\\.bestpractices\\.dev|api\\.securityscorecards\\.dev|(?:static\\.)?pepy\\.tech|sonarcloud\\.io|readthedocs\\.org|img\\.badgesize\\.io|snyk\\.io/test|discord(?:app)?\\.com/api/guilds|camo\\.githubusercontent\\.com|vercel\\.com/button|deploy\\.workers\\.cloudflare\\.com)/|github\\.com/[^)]*/(?:badge\\.svg|actions/workflows/))"
owasp:
  - "LLM02:2025 Sensitive Information Disclosure"
  - "ASI05 Sensitive Data Leakage"
fix: >
  Remove query strings from Markdown image URLs. A legitimate badge or image
  does not need to send parameters to its host. If tracking is needed, use
  a server-side redirect that does not expose data in the URL.
