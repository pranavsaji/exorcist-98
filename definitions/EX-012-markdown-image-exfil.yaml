id: EX-012
title: Markdown image exfiltration
severity: high
applies_to:
  - instruction
  - docs
match:
  # A markdown image whose query string carries data: a parameter named like
  # data, token, env or user, or a template such as {{...}} or ${...}. Ordinary
  # images with query strings (stat cards, size options) are not flagged; that
  # was 390 false alarms in one README in the second blind round. A number
  # in q= or d= is an image setting (quality, density) that image CDNs and
  # Next.js image URLs carry, not data.
  regex: "!\\[[^\\]]*\\]\\(https?://[^)?\\s]+(?=\\?)[^)\\s]*(?:[?&](?:(?:d|q)=(?!\\d{1,4}(?:[&)\\s]|$))|(?:data|payload|content|text|msg|token|key|secret|password|pass|pwd|env|cookie|session|auth|creds?|leak|info|user|email)=)|\\{\\{|\\$\\{|%s|<[a-z_]+>|\\b(?:PLACEHOLDER|REPLACE_ME|INSERT)\\b)[^)\\s]*\\)"
  # Well-known badge services take query strings by design. So do the image
  # links Google Docs (googleusercontent, ?key=) and GitBook (alt=media&token=)
  # make for pictures that were pasted into a document: the key or token is
  # the picture's own address, issued by the host that serves it.
  exclude_regex: "\\]\\(https?://(?:(?:img\\.shields\\.io|shields\\.io|badgen\\.net|badge\\.fury\\.io|(?:app\\.)?codecov\\.io|coveralls\\.io|(?:api\\.)?travis-ci\\.(?:org|com)|(?:dl\\.)?circleci\\.com|api\\.netlify\\.com|deepwiki\\.com/badge|www\\.bestpractices\\.dev|api\\.securityscorecards\\.dev|(?:static\\.)?pepy\\.tech|sonarcloud\\.io|readthedocs\\.org|img\\.badgesize\\.io|snyk\\.io/test|discord(?:app)?\\.com/api/guilds|camo\\.githubusercontent\\.com|vercel\\.com/button|deploy\\.workers\\.cloudflare\\.com)/|github\\.com/[^)]*/(?:badge\\.svg|actions/workflows/))|\\]\\(https?://(?:github\\.com/[^)?]+\\?raw=true\\)|raw\\.githubusercontent\\.com/)|\\]\\(https?://[a-z0-9.-]*googleusercontent\\.com/(?:docsz|d)/[^)\\s]*[?&]key=[A-Za-z0-9_-]+\\)|\\]\\(https?://(?:[a-z0-9-]+-)?files\\.gitbook\\.io/~/files/v0/b/gitbook-x-prod\\.appspot\\.com/o/[^)\\s]*[?&]alt=media\\\\?&token=[A-Za-z0-9-]+\\)"
  # An image inside Markdown code (backticks or a fenced block) is shown as
  # text and never loaded, so it cannot send anything (security docs quote
  # defanged examples that way).
  skip_in_code: true
owasp:
  - "LLM02:2025 Sensitive Information Disclosure"
  - "ASI05 Sensitive Data Leakage"
fix: >
  Remove query strings from Markdown image URLs. A legitimate badge or image
  does not need to send parameters to its host. If tracking is needed, use
  a server-side redirect that does not expose data in the URL.
