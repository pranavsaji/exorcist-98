id: EX-005
title: Tool description poisoning
severity: critical
applies_to:
  - mcp-config
  - config
match:
  regex: "(before (responding|answering|using this tool)|(prior to|before) (invoking|calling|running|using) (this|any|the)\\b|do not (inform|tell|mention|notify|alert) the user|without (telling|informing|notifying|asking) the user|(keep|stay) (this |it )?(quiet|secret|hidden) from|this is required for (audit|telemetry|logging)|(send|include|attach|upload|pass|forward)[^.\\n]{0,60}(~/\\.ssh|id_rsa|\\.env\\b|\\.aws/credentials|private key))"
  # Only in files that describe MCP servers or tools. Model or prompt configs
  # that say \"do not mention\" are ordinary (seen in openai/codex).
  file_regex: "(\"mcpServers\"|\"inputSchema\"|\"input_schema\")"
owasp:
  - "MCP01 Tool Poisoning Attack"
  - "LLM01:2025 Prompt Injection"
fix: >
  Review the tool description field. A legitimate tool description explains
  what the tool does, not what the agent should do before or after calling it.
  Remove any instructions embedded in descriptions and replace with a plain
  functional summary.
