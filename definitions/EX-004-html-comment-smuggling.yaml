id: EX-004
title: HTML comment smuggling
severity: high
applies_to:
  - instruction
  - docs
match:
  # The match stays inside one comment ((?!-->) stops it at the closing marker).
  # Ordinary words like "fetch" or "send to" are not enough on their own.
  regex: "<!--(?:(?!-->)[\\s\\S]){0,2000}?(?:\\b(?:ignore|disregard)\\s+(?:all\\s+|any\\s+|the\\s+)?(?:previous|prior|above|earlier)|exfiltrat|\\bsilently\\b|\\bdo\\s+not\\s+(?:mention|tell|reveal|inform)|\\b(?:ai|assistant|agent|llm|claude|copilot|cursor|kiro|gemini)\\s*[:,]\\s|\\byou\\s+are\\s+(?:now|an?\\s+ai)\\b|\\bas\\s+an\\s+ai\\b|\\b(?:curl|wget)\\s+\\S+[^\\n]*\\|\\s*(?:ba|z)?sh\\b|\\bsend\\s+(?:the\\s+|all\\s+|any\\s+)?(?:contents?|secrets?|keys?|tokens?|credentials?|\\.env)\\b)(?:(?!-->)[\\s\\S]){0,2000}?-->"
owasp:
  - "LLM01:2025 Prompt Injection"
  - "ASI03 Prompt Injection via External Content"
fix: >
  Remove the HTML comment or replace its contents with a benign description.
  Legitimate comments in Markdown should not contain imperative instructions
  aimed at AI agents. Consider running a linter rule that bans instruction
  keywords inside HTML comments.
