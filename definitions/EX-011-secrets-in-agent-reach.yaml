id: EX-011
title: Secrets in agent reach
severity: high
applies_to:
  - instruction
  - docs
  - config
  - code
  - unknown
match:
  # Well-known secret variables, and secrets recognisable by their own format
  # (GitHub, OpenAI, Anthropic, AWS, Slack, Google, Stripe and npm tokens, and
  # private keys) wherever they appear (L-015).
  regex: "(?:(?:(?:AWS_SECRET_ACCESS_KEY|GITHUB_TOKEN|GH_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY|SLACK_BOT_TOKEN|STRIPE_SECRET_KEY|GOOGLE_API_KEY|NPM_TOKEN)=(?!EXAMPLE_)[^\\s]+|DATABASE_URL=[a-z+]+://[^\\s:@/]+:[^\\s@/]+@[^\\s]+)|\\b(?:gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|sk-(?:proj-|ant-api\\d\\d-)?[A-Za-z0-9_-]{40,}|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{20,}|AIza[0-9A-Za-z_-]{35}|sk_live_[0-9A-Za-z]{24,}|npm_[A-Za-z0-9]{36})\\b|(?<=^|\\n)-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----)"
  # Placeholders such as [REDACTED], xxx, <token> or ${VAR} are not secrets.
  exclude_regex: "=\\s*[\"']?(\\[?redacted\\]?|x{3,}|\\*{3,}|<|\\$\\{?[A-Za-z_]+\\}?|your[_-]|changeme|placeholder|dummy|fake|[^\\s]*\\.\\.\\.)|^(?:gh[pousr]_|github_pat_|sk-|sk_live_|AKIA|xox[baprs]-|AIza|npm_)\\S*(?:EXAMPLE|SYNTHETIC|ABCDEFGHIJ|x{8,}|X{8,}|0{12,})|=\\s*[a-z_][a-z0-9_.]*\\s*[,)]|=\\s*[\"'`]?[A-Za-z]{2,4}_x{3,}|=\\s*[\"']?\\$\\(|=\\s*[\"']?\\$[A-Za-z_]|=[\"']$|=[\"'][/\\\\']"
# Test files hold fake secrets and sample payloads on purpose.
skip_paths:
  - "(^|/)(tests?|__tests__|__mocks__|spec|specs|fixtures?|testdata|test-data|e2e)/|[._-](test|spec)s?\\.[A-Za-z0-9]+$|(^|/|_)tests?\\.(rs|go|py)$"
owasp:
  - "LLM02:2025 Sensitive Information Disclosure"
  - "ASI05 Sensitive Data Leakage"
fix: >
  Move the credential to a .env file and add .env to .gitignore and
  .kiroignore. Use a secrets manager for production. Never hard-code secrets
  in files an agent reads.
