id: EX-011
title: Secrets in agent reach
severity: high
applies_to:
  - instruction
  - docs
  - config
  - code
  - unknown
match:
  regex: "(AWS_SECRET_ACCESS_KEY|GITHUB_TOKEN|OPENAI_API_KEY|DATABASE_URL)=(?!EXAMPLE_)[^\\s]+"
  # Placeholders such as [REDACTED], xxx, <token> or ${VAR} are not secrets.
  exclude_regex: "=\\s*[\"']?(\\[?redacted\\]?|x{3,}|\\*{3,}|<|\\$\\{?[A-Za-z_]+\\}?|your[_-]|changeme|placeholder|dummy|fake|[^\\s]*\\.\\.\\.)"
# Test files hold fake secrets and sample payloads on purpose.
skip_paths:
  - "(^|/)(tests?|__tests__|__mocks__|spec|specs|fixtures?|testdata|test-data|e2e)/|[._-](test|spec)s?\\.[A-Za-z0-9]+$|_tests?\\.(rs|go|py)$"
owasp:
  - "LLM02:2025 Sensitive Information Disclosure"
  - "ASI05 Sensitive Data Leakage"
fix: >
  Move the credential to a .env file and add .env to .gitignore and
  .kiroignore. Use a secrets manager for production. Never hard-code secrets
  in files an agent reads.
