id: EX-032
title: Instructions to push or publish somewhere else
severity: high
applies_to:
  - instruction
  - docs
  - memory
  - tool-result
match:
  # Text addressed to an agent that asks it to send code somewhere else:
  # push to a remote other than origin, add or re-point a remote, publish a
  # package, change the package registry, or open a pull request against a
  # different repository. The sentence has to be plainly talking to the agent
  # ("you must", "please", "silently", "before you continue", "to proceed")
  # before the action, with no negation in between (the match starts at the
  # cue so a quoted example is recognised). "Maintainers run `npm publish` to release" is a release
  # process for people and is not flagged.
  regex: '(?:\byou\s+(?:must|should|need\s+to|have\s+to|will|shall|are\s+to|can\s+now)\b|\bplease\b|\b(?:agent|assistant|ai|claude|kiro|copilot|cursor|llm|model)s?\s*[,:]|\b(?:the\s+)?(?:agent|assistant|ai|llm|model)\s+(?:must|should|needs?\s+to|has\s+to|will|shall)\b|\bsilently\b|\bquietly\b|\bwithout\s+(?:asking|telling|mentioning|informing|notifying)\b|\bbefore\s+(?:you|answering|continuing|responding|proceeding)\b|\bto\s+(?:continue|proceed|finish|complete)\b|\bimportant\s*:|\bnote\s+to\s+(?:the\s+)?(?:agent|ai|assistant)\b|\bnext\s*,?\s+step\b)(?:(?!\b(?:not|never|cannot|avoid|refrain|unable|forbidden|prohibited)\b|n[''’]t\b)[^.!?\n]){0,60}?(?:\bgit\s+push\b(?:\s+-{1,2}[\w-]+)*\s+(?!origin\b)(?:https?://|ssh://|git@|[A-Za-z][\w.-]*\s)|\bpush\b[^.!?\n]{0,40}?\bto\b[^\n]{0,20}?(?:https?://|ssh://|git@)|\bgit\s+remote\s+(?:add|set-url)\b|\badd\b[^.!?\n]{0,20}?\b(?:new|another|extra|second)\s+(?:git\s+)?remote\b|\b(?:npm|pnpm|yarn|bun|cargo|gem|twine)\s+(?:publish|upload|push)\b|\bpublish\b[^.!?\n]{0,30}?\b(?:package|crate|gem|module|library|build|release)\b|\b(?:npm|pnpm|yarn)\s+config\s+set\s+registry\b|\b(?:change|set|switch|point|replace|override|update)\b[^.!?\n]{0,40}?\b(?:npm|package|pip|cargo|gem|default)?\s*registry\b|--registry[=\s]|\bregistry\s*=\s*https?://|\bgh\s+pr\s+create\b[^\n]{0,80}?--repo\b|\b(?:open|create|file|submit|send|raise)\b[^.!?\n]{0,30}?\b(?:pull\s+request|PR)\b[^.!?\n]{0,30}?\b(?:against|to|on|in)\b[^.!?\n]{0,20}?\b(?:different|another|other|external|upstream|fork|attacker)\b)'
  # A phrase in a passage that warns about it or quotes it as an example is not an order.
  quoted_example_cues: '\b(?:such\s+as|e\.g\.|i\.e\.|for\s+(?:example|instance)|never|do\s+not|don''t|must\s+not|should\s+not|refuse|reject|treat|untrusted|inert|injection|jailbreak|adversarial|attack|malicious|hostile|crafted|hijack|red[- ]?team|detect|flag|block|strip|sanitiz|filter|pattern|phrase|cases?\b|example|quarantine|directive|look(?:s|ing)?\s+like|shaped)'
  # A sentence that forbids the action is a defence ("never push to a different remote").
  negated_cues: '\b(?:(?:must|should|shall|will|would|may|might|can|could)\s*(?:not|never)|(?:must|should|shall|would|could|do|does|did|is|are|was|were|has|have|ca|wo)n[''’]t|cannot|do(?:es)?\s+not|did\s+not|never|avoid|refrain\s+from|refus(?:e|es|ed|ing)\s+to|(?:is|are)\s+not\s+(?:to|allowed\s+to|permitted\s+to|able\s+to)|unable\s+to|forbidden\s+to|prohibited\s+from)\s+(?:(?:ever|simply|just|even|actually|knowingly|first|then|also|silently|quietly)\s+)*$'
low_severity_paths:
  - "(^|/)(tests?|__tests__|__mocks__|spec|specs|fixtures?|testdata|test-data|e2e|evals?)/|[._-](test|spec)s?\\.[A-Za-z0-9]+$|_tests?\\.(rs|go|py)$"
owasp:
  - "ASI03 Prompt Injection via External Content"
  - "LLM01:2025 Prompt Injection"
fix: >
  Remove the instruction. A file your agent reads should not tell it to push
  to another remote, publish a package, change the registry or open a pull
  request against another repository. Do those steps yourself. If you are
  documenting the attack, put it in a fenced code block or say that the agent
  must never do it.
