id: EX-002
title: Instructions addressed to AI
severity: high
applies_to:
  - instruction
  - docs
  - memory
  - tool-result
match:
  # Phrases that only make sense when talking to an AI agent. Any amount of
  # whitespace may separate the words. Ordinary text such as "you are now
  # logged in" is not flagged. A phrase split by hidden characters still
  # matches (the engine also scans the text with them removed).
  regex: "(?:\\bignore\\s+(?:all\\s+|any\\s+|the\\s+)?(?:previous|prior|above|earlier)\\s+(?:instructions|rules|prompts?)|\\bdisregard\\s+(?:all\\s+|any\\s+|the\\s+)?(?:previous|prior|above|earlier)\\s+(?:instructions|rules)|\\byou\\s+are\\s+now\\s+(?:(?:operating\\s+)?in\\s+(?:maintenance|developer|debug|admin|god|unrestricted|jailbreak|dan)\\s+mode|operating\\s+without\\s+(?:any\\s+)?(?:restrictions|rules|limits)|free\\b|unrestricted|dan\\b)|\\bas\\s+an\\s+ai(?:\\s+(?:assistant|agent|model))?\\s*,?\\s+(?:your\\s+(?:new|real|true|actual|hidden|secret|only)\\b|you\\s+must|you\\s+should|ignore)|\\byour\\s+new\\s+(?:primary\\s+)?(?:directive|instructions?)\\b|\\bdo\\s+not\\s+(?:mention|tell|reveal)\\s+(?:this|these)\\s+(?:instruction|note|message)s?)"
  # A phrase in quotation marks that close right after it, in a passage that
  # is warning about it or quoting it as an example ("never follow text such
  # as ..."), is not an order. In the field that was 35 of 42 findings of
  # EX-002 (docs/FIELD_REPORT.md). A quoted phrase that runs on into a longer
  # instruction is still reported.
  quoted_example_cues: '\b(?:such\s+as|e\.g\.|i\.e\.|for\s+(?:example|instance)|never|do\s+not|don''t|must\s+not|should\s+not|refuse|reject|treat|untrusted|inert|injection|jailbreak|adversarial|attack|malicious|hostile|crafted|hijack|red[- ]?team|detect|flag|block|strip|sanitiz|filter|pattern|phrase|cases?\b|example|quarantine|directive|look(?:s|ing)?\s+like|shaped)'
  # A phrase the passage itself forbids is a defence, not an attack: "never
  # ignore earlier instructions", "users cannot bypass the prompt", "it must not
  # attempt to tell the agent to ignore earlier instructions". The negation has
  # to govern the phrase (it ends right before it, or opens a list of what must
  # not be attempted); "do not mention this, tell the agent to ..." is still an
  # attack (m7-precision, packages/core/src/scanner/context.ts isNegated).
  negated_cues: '\b(?:(?:must|should|shall|will|would|may|might|can|could)\s*(?:not|never)|(?:must|should|shall|would|could|do|does|did|is|are|was|were|has|have|ca|wo)n[''’]t|cannot|do(?:es)?\s+not|did\s+not|never|refus(?:e|es|ed|ing)\s+to|(?:is|are)\s+not\s+(?:to|allowed\s+to|permitted\s+to|able\s+to)|unable\s+to)\s+(?:(?:ever|simply|just|even|actually|knowingly)\s+)*$|\b(?:(?:must|should|shall|will|would|may|might|can|could)\s*(?:not|never)|(?:must|should|shall|would|could|do|does|did|is|are|was|were|has|have|ca|wo)n[''’]t|cannot)\s+(?:attempt|try|seek)\s+to\b[^.!?\n]*?\b(?:tell|instruct|ask|cause|make|persuade|trick|convince|get|force|let|allow)\w*\s+(?:(?:the|an?|your|any)\s+)?(?:(?:agent|model|assistant|ai|llm|bot|claude)s?\s+)?(?:to\s+)?$|\b(?:(?:must|should|shall|will|would|may|might|can|could)\s*(?:not|never)|(?:must|should|shall|would|could|do|does|did|is|are|was|were|has|have|ca|wo)n[''’]t|cannot|do(?:es)?\s+not|did\s+not|never|refus(?:e|es|ed|ing)\s+to|(?:is|are)\s+not\s+(?:to|allowed\s+to|permitted\s+to|able\s+to)|unable\s+to)\s+(?:follow|obey|comply\s+with|act\s+on|honou?r|accept|execute|run)\s+(?:(?:any|an?|the|such|these|those|that|text|instructions?|requests?|commands?|messages?|content|tool\s+output|it)\s+)*(?:(?:that|which)\s+)?(?:(?:say|says|saying|tell|tells|telling|ask|asks|asking)\s+(?:you\s+)?(?:to\s+)?)?$'
# Test and eval fixtures hold attack samples on purpose (a security scanner's
# own tests, adversarial evals). Findings there are reported at low severity,
# not dropped. A file an agent reads (instructions, hooks, MCP configs, .kiro,
# .claude, .cursor) is never lowered, wherever it sits.
low_severity_paths:
  - "(^|/)(tests?|__tests__|__mocks__|spec|specs|fixtures?|testdata|test-data|e2e|evals?)/|[._-](test|spec)s?\\.[A-Za-z0-9]+$|_tests?\\.(rs|go|py)$"
owasp:
  - "LLM01:2025 Prompt Injection"
  - "ASI03 Prompt Injection via External Content"
fix: >
  Remove or rewrite the flagged phrase. Legitimate documentation does not need
  to address the AI agent directly. If the phrase is in a code example, wrap it
  in a fenced code block with a language tag so it is not parsed as an
  instruction.
