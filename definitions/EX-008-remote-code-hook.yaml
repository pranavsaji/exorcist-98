id: EX-008
title: Remote code in hook
severity: critical
applies_to:
  - hook
  - mcp-config
  - config
  - tool-result
match:
  # A download (from a URL or host name) piped into a shell or an interpreter
  # that runs it, or decoded base64 piped into one. "curl | sh" with no
  # address is a mention, not a command, and "| python -c" or "| node -e"
  # reads the download as data.
  # The lookahead right after "curl " only checks that a "| shell" follows
  # within 1,200 characters (200 + the longest host name, 600, + 400): every
  # match already has one there, so results are the same, but a long line full
  # of curl mentions with no pipe to a shell fails fast instead of trying every
  # host position (about 5x faster on a 180 KB line).
  regex: "((?:curl|wget)\\s+(?=[^\\n]{0,1200}?\\|\\s*(?:sudo\\s+(?:-\\S+\\s+)*)?(?:sh|bash|zsh|fish|dash|python3?|node)\\b)[^\\n]{0,200}?(?:https?://|\\b\\d{1,3}(?:\\.\\d{1,3}){3}\\b|\\b[A-Za-z0-9-]{1,63}(?:\\.[A-Za-z0-9-]{1,63}){0,8}\\.[A-Za-z]{2,24}\\b)[^\\n]{0,400}?\\|\\s*(?:sudo\\s+(?:-\\S+\\s+)*)?(?:sh|bash|zsh|fish|dash|python3?|node)\\b(?!\\s+-[cemp]\\b)|base64\\s+(-d|--decode|-D)\\b[^\\n]*\\|\\s*(sh|bash|zsh|python3?|node)\\b)"
  # In generic JSON and YAML files, only commands that run count: the value of
  # a command-like key ("command", "run", "setup_commands", "args"), an item
  # of such a list, a step the text tells the reader to run ("Run: curl ..."),
  # or anything in an agent-environment or hook file (.cursor/environment.json,
  # .devcontainer/, .claude/, .kiro/, hooks.json). An install command listed
  # as data (a docs data file, an agent catalogue) is not a hook. Hooks, MCP
  # configs and tool results are always checked in full.
  exec_context: true
# CI workflows are not agent hooks; installers there are a separate supply-chain topic.
skip_paths:
  - "^\\.github/workflows/"
  - "(^|/)action\\.ya?ml$"
  - "(^|/)(tests?|__tests__|__mocks__|spec|specs|fixtures?|testdata|test-data|e2e)/|[._-](test|spec)s?\\.[A-Za-z0-9]+$|_tests?\\.(rs|go|py)$"
# EX-008 and EX-015 both match a download piped into a shell; on the same line
# they are one problem, and only the more severe finding is kept.
same_line_group: remote-shell
owasp:
  - "ASI06 Prompt Injection via Indirect Content"
  - "LLM01:2025 Prompt Injection"
fix: >
  Never pipe remote content directly into a shell. Download the script to a
  known path, verify its checksum, and execute it separately. Better yet,
  replace the remote script with a versioned local task in the repo.
