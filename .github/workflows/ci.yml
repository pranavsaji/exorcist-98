name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Node 20 reached end of life in 2026; everything is tested on Node 22.
# pnpm's version comes from "packageManager" in package.json (pnpm/action-setup
# refuses to run when a second version is also given here).

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # L-044: the EX-001 fixture holds real invisible characters that editors
      # can strip; regenerating it must give the committed bytes.
      - name: Hidden-character fixture regenerates unchanged
        run: node scripts/make-ex001-fixture.mjs && git diff --exit-code fixtures/haunted-repo/EX-001-hidden-unicode.md
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Drives the Chrome that ships on GitHub's Ubuntu runners against the built web app.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @exorcist-98/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Start the web app
        run: |
          pnpm --filter @exorcist-98/web exec next start -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:3000/ > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/web.log"; exit 1
      - run: pnpm e2e
        env:
          E2E_BASE: http://localhost:3000
          CHROME_PATH: /usr/bin/google-chrome
          E2E_OUT: e2e-output
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-output
